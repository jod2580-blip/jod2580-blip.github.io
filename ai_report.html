<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동향보고 초안 생성 (AI 학습 ①)</title>
<style>
  :root { --bg:#0f1720; --card:#1b2530; --ai:#7c9cf5; --farm:#48bb78; --task:#f0b429; --fg:#e6edf3; --muted:#8b9aa8; --line:rgba(139,154,168,.35); }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f8; --card:#ffffff; --fg:#1c2733; --muted:#67757f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%; }
  header { padding:14px 16px 6px; max-width:640px; margin:0 auto; }
  h1 { margin:0; font-size:19px; letter-spacing:-.5px; }
  .sub { margin:3px 0 0; color:var(--muted); font-size:12px; }
  .menu { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .menu::-webkit-scrollbar { display:none; }
  .menu a { flex:0 0 auto; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--fg);
    background:var(--card); padding:6px 12px; border-radius:999px; box-shadow:0 1px 2px rgba(0,0,0,.16); }
  .menu a.on { background:var(--ai); color:#0b1420; }
  main { max-width:640px; margin:0 auto; padding:0 12px 40px; }
  .box { background:var(--card); border-radius:14px; padding:11px 13px; margin:0 0 8px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  h2 { font-size:12.5px; color:var(--muted); font-weight:700; margin:0 2px 8px; letter-spacing:.3px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid .full { grid-column:1 / -1; }
  label.f { display:block; font-size:11.5px; color:var(--muted); margin:0 0 3px 2px; }
  input, select, textarea { width:100%; font-size:14px; padding:9px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); font-family:inherit; }
  textarea { min-height:64px; resize:vertical; }
  .chk { display:flex; align-items:center; gap:6px; font-size:13px; }
  .chk input { width:auto; }
  .timeline .row { display:grid; grid-template-columns:78px 1fr 34px; gap:6px; margin-bottom:6px; }
  .timeline .del { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:10px; font-size:15px; padding:0; }
  button { font-size:13.5px; font-weight:700; padding:10px 14px; border-radius:11px; border:0;
    background:var(--ai); color:#0b1420; cursor:pointer; font-family:inherit; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:active { opacity:.75; }
  .bar { display:flex; gap:7px; flex-wrap:wrap; margin:2px 0 8px; }
  .note { font-size:11.5px; color:var(--muted); margin:8px 2px 0; }
  .note b { color:var(--fg); }

  /* ── 문서(표) 스타일 ── */
  #paper { background:#fff; color:#111; border-radius:12px; padding:14px 12px 18px;
    box-shadow:0 1px 4px rgba(0,0,0,.25); margin-bottom:10px; display:none; }
  #paper .doc-h { text-align:center; font-size:20px; font-weight:800; letter-spacing:6px; margin:2px 0 10px; }
  #paper .doc-meta { font-size:11.5px; color:#333; display:flex; justify-content:space-between;
    border-bottom:2px solid #111; padding-bottom:5px; margin-bottom:10px; }
  #paper .doc-title { font-size:14.5px; font-weight:800; text-align:center; margin:10px 0 12px; line-height:1.4; }
  #paper h3 { font-size:12px; font-weight:800; margin:14px 0 5px; padding-left:6px; border-left:4px solid #111; }
  #paper table { width:100%; border-collapse:collapse; font-size:11.5px; table-layout:fixed; }
  #paper th, #paper td { border:1px solid #444; padding:5px 6px; vertical-align:top; word-break:break-word; }
  #paper th { background:#ededed; font-weight:700; text-align:left; }
  #paper td.k { background:#f6f6f6; font-weight:700; width:28%; }
  #paper .body-p { border:1px solid #444; padding:7px 8px; font-size:11.5px; line-height:1.55; }
  #paper .chklist { font-size:11px; color:#333; margin:4px 0 0; padding-left:16px; }
  #paper .chklist li { margin-bottom:2px; }
  #paper .foot { font-size:10px; color:#666; text-align:center; margin-top:14px; border-top:1px solid #bbb; padding-top:5px; }
  details.raw { margin:6px 0 0; }
  details.raw summary { font-size:12px; color:var(--muted); cursor:pointer; }
  pre { font-family:"Noto Sans Mono CJK KR",ui-monospace,monospace; font-size:11.5px; line-height:1.5;
    background:var(--card); border-radius:12px; padding:10px; margin:6px 0 0; white-space:pre-wrap; word-break:break-word; }
  @media print {
    header, nav, .menu, .box, .bar, .note, footer, details.raw, #rawwrap { display:none !important; }
    body { background:#fff; color:#000; }
    main { max-width:none; margin:0; padding:0; }
    #paper { display:block !important; box-shadow:none; border-radius:0; padding:0; }
    #paper table { font-size:10.5pt; }
    #paper .doc-h { font-size:18pt; }
  }
</style>
</head>
<body>
<header>
  <h1>📝 동향보고 초안 생성</h1>
  <p class="sub">AI 학습 ① · 항목만 채우면 표 서식 문서로 만들어 줍니다</p>
  <nav class="menu">
    <a href="index.html">🏠 홈</a>
    <a href="calendar.html">📅 캘린더</a>
    <a href="train.html">🚝 열차</a>
    <a href="journal.html">🌱 재배일지</a>
    <a href="ai.html" class="on">🤖 AI학습</a>
    <a href="privacy.html">🔒 개인정보</a>
  </nav>
</header>
<main>
  <div class="box">
    <h2>1) 기본 정보</h2>
    <div class="grid">
      <div class="full"><label class="f">일시</label><input id="when" type="datetime-local"></div>
      <div><label class="f">날씨</label>
        <select id="wx"><option>맑음</option><option>흐림</option><option>비</option><option>눈</option><option>미확인</option></select></div>
      <div><label class="f">역</label>
        <select id="stn"><option>범물</option><option>수성못</option><option>지산</option><option>황금</option><option>어린이세상</option><option>용지</option></select></div>
      <div class="full"><label class="f">장소 (깊이순: 설비 &gt; 상세 &gt; 세부)</label>
        <input id="place" placeholder="예: 에스컬레이터 &gt; 에스컬레이터#5 &gt; 초입"></div>
      <div><label class="f">사고유형</label>
        <input id="type" list="types" placeholder="끼임 / 넘어짐 / 승객난동…">
        <datalist id="types"><option>끼임</option><option>넘어짐</option><option>승객난동</option><option>추락</option><option>부정승차</option><option>설비고장</option></datalist></div>
      <div><label class="f">사고원인(대분류)</label>
        <input id="cause1" list="causes" placeholder="본인부주의 / 시설물 기인…">
        <datalist id="causes"><option>본인부주의</option><option>시설물 기인</option><option>제3자기인</option><option>운전취급</option><option>미확인</option></datalist></div>
      <div><label class="f">사고원인(세부)</label><input id="cause2" placeholder="예: 중심잃음"></div>
      <div><label class="f">사고자</label>
        <select id="who"><option>여객</option><option>종사자</option><option>기타</option></select></div>
    </div>
  </div>

  <div class="box">
    <h2>2) 대응 정보</h2>
    <div class="grid">
      <div><label class="f">긴급신고</label>
        <select id="emg"><option>없음</option><option>119</option><option>112</option><option>112·119</option></select></div>
      <div><label class="f">출동소속(명)</label><input id="unit" placeholder="예: 수성119안전센터(3명)"></div>
      <div><label class="f">출동근거</label>
        <select id="basis"><option>직원신고</option><option>고객신고</option><option>초동대처</option></select></div>
      <div><label class="f">최종목적지</label><input id="dest" placeholder="귀가(집) / 병원"></div>
      <div><label class="f">동반인</label>
        <select id="with"><option>없음</option><option>가족</option><option>지인</option><option>미확인</option></select></div>
      <div><label class="f">음주상태</label>
        <select id="drink"><option>[ ]</option><option>[ V ]</option><option>미확인</option></select></div>
      <div><label class="f">승차권반환(건)</label><input id="refund" placeholder="0"></div>
      <div><label class="f">승차권반환(원)</label><input id="refundw" placeholder="0"></div>
      <div class="full"><label class="chk"><input id="cctv" type="checkbox" checked> CCTV 영상 확보</label></div>
      <div class="full"><label class="f">주요내용 (팩트만 1~2문장)</label>
        <textarea id="body" placeholder="상기 일시에 사고자가 E/S #5 도입부에서 몸을 우측면에 기대어 승차하던 중 중심을 잃고 뒤로 넘어짐"></textarea></div>
    </div>
  </div>

  <div class="box timeline">
    <h2>3) 조치사항 (시간순)</h2>
    <div id="rows"></div>
    <div class="bar"><button class="ghost" id="add">+ 시간 추가</button></div>
  </div>

  <div class="box">
    <h2>4) 기타</h2>
    <div class="grid">
      <div class="full"><label class="f">부상 정도</label><input id="inj" placeholder="예: 오른손 등 찰과상 / 없음"></div>
      <div><label class="f">성명(마스킹)</label><input id="pname" placeholder="신○○"></div>
      <div><label class="f">전화번호</label><input id="ptel" placeholder="미고지"></div>
      <div><label class="f">성별</label><select id="psex"><option>미확인</option><option>남</option><option>여</option></select></div>
      <div><label class="f">연령대</label><input id="page" placeholder="65세 이상"></div>
      <div><label class="f">부상부위</label><input id="ppart" placeholder="오른팔"></div>
      <div><label class="f">부상종류</label><input id="pkind" placeholder="찰과상"></div>
      <div><label class="f">대물파손</label><input id="pdam" placeholder="해당없음"></div>
      <div><label class="f">직업</label><input id="pjob" placeholder="미고지"></div>
      <div class="full"><label class="f">민원인 문의사항 (있으면)</label><input id="ask" placeholder="없음"></div>
    </div>
  </div>

  <div class="bar">
    <button id="gen">초안 생성</button>
    <button class="ghost" id="copy">텍스트 복사</button>
    <button class="ghost" id="print">인쇄 / PDF</button>
  </div>

  <div id="paper"></div>
  <div id="rawwrap" style="display:none">
    <details class="raw"><summary>마크다운 원문 보기</summary><pre id="out"></pre></details>
  </div>

  <p class="note"><b>주의</b> — 서식 자동 정리 도구입니다. 문장 다듬기·원인코드 확정·개인정보 마스킹 최종 확인은 담당자 몫.<br>
  실제 AI 초안(과거 보고 3건 참조)은 텔레그램 두리에게 “동향보고 초안” + 사고 메모로 요청.</p>
</main>
<footer><p><a href="ai.html">AI 학습으로</a></p></footer>
<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function addRow(t, txt){
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `<input class="t" placeholder="09:31" value="${esc(t||"")}">
    <input class="c" placeholder="조치 내용" value="${esc(txt||"")}">
    <button class="del" type="button">×</button>`;
  div.querySelector(".del").onclick = () => div.remove();
  $("rows").appendChild(div);
}
$("add").onclick = () => addRow("", "");

function fmtWhen(v){
  if (!v) return "미기재";
  const [d, t] = v.split("T");
  const [y, m, dd] = d.split("-");
  const wd = ["일","월","화","수","목","금","토"][new Date(d + "T00:00:00").getDay()];
  return `${y}.${m}.${dd}.(${wd}) ${t}`;
}

function collect(){
  const place = ($("place").value || "").trim();
  const rows = [...document.querySelectorAll("#rows .row")]
    .map(r => ({ t: r.querySelector(".t").value.trim(), c: r.querySelector(".c").value.trim() }))
    .filter(r => r.c);
  return {
    when: fmtWhen($("when").value),
    wx: $("wx").value, stn: $("stn").value, place,
    type: ($("type").value || "").trim() || "미기재",
    c1: ($("cause1").value || "").trim() || "미확인",
    c2: ($("cause2").value || "").trim(),
    who: $("who").value, emg: $("emg").value,
    unit: $("unit").value.trim() || "해당없음",
    basis: $("basis").value, dest: $("dest").value.trim() || "미기재",
    with: $("with").value, drink: $("drink").value,
    refund: $("refund").value.trim() || "0", refundw: $("refundw").value.trim() || "0",
    cctv: $("cctv").checked,
    body: ($("body").value || "").trim() || "상기 일시와 장소에서 " + (($("type").value || "").trim() || "사고") + " 발생",
    inj: $("inj").value.trim() || "미확인",
    pname: $("pname").value.trim() || "미고지", ptel: $("ptel").value.trim() || "미고지",
    psex: $("psex").value, page: $("page").value.trim() || "미확인",
    ppart: $("ppart").value.trim() || "미확인", pkind: $("pkind").value.trim() || "미확인",
    pdam: $("pdam").value.trim() || "해당없음", pjob: $("pjob").value.trim() || "미고지",
    ask: $("ask").value.trim() || "없음",
    rows,
  };
}

function titleOf(s){
  const dev = s.place ? s.place.split(">")[0].trim() : "";
  return `${s.stn}역 ${dev ? dev + " " : ""}${s.type} 사고`;
}

function toMarkdown(s){
  const L = [];
  L.push(`# 동향보고 초안 — ${s.stn}역 ${s.type} 사고`, "");
  L.push(`- **보고일**: ${s.when.slice(0, 10)}`, `- **보고자**: 수성못관리역장(대) ○○○`, "");
  L.push("## 제목", titleOf(s), "", "## 개요", "| 항목 | 내용 |", "| --- | --- |");
  L.push(`| 일시 | ${s.when} (${s.wx}) |`);
  L.push(`| 장소 | 3호선 > ${s.stn} > ${s.place || "미기재"} |`);
  L.push(`| 사고유형 | ${s.type} |`);
  L.push(`| 사고원인 | ${s.c1}${s.c2 ? " > " + s.c2 : ""} |`);
  L.push(`| 음주상태 | ${s.drink} |`, `| 사고자 | ${s.who} |`, `| 긴급신고 | ${s.emg} |`);
  L.push(`| 출동소속(명) | ${s.unit} |`, `| 최종목적지 | ${s.dest} |`, `| 동반인 | ${s.with} |`);
  L.push(`| 출동근거 | ${s.basis} |`, `| CCTV 영상 확보 | ${s.cctv ? "[ V ]" : "[ ]"} |`);
  L.push(`| 승차권반환 | ${s.refund}건 ${s.refundw}원 |`, "", "## 주요내용", s.body, "", "## 조치사항");
  L.push(s.rows.length ? s.rows.map(r => `- **${r.t || "--:--"}** ${r.c}`).join("\n") : "- **--:--** 조치 내용 기재");
  L.push("", "## 기타", `**부상 정도**: ${s.inj}`, "");
  L.push("| 성명 | 전화번호 | 성별 | 장애 | 연령대 | 부상부위 | 부상종류 | 대물파손 | 직업 |");
  L.push("| --- | --- | --- | --- | --- | --- | --- | --- | --- |");
  L.push(`| ${s.pname} | ${s.ptel} | ${s.psex} | 미확인 | ${s.page} | ${s.ppart} | ${s.pkind} | ${s.pdam} | ${s.pjob} |`);
  L.push("", `**민원인 문의사항**: ${s.ask}`, "", "## 확인 필요");
  L.push("- 개인정보 마스킹(성명·연락처) 확인", "- 부상정도와 진단명 일치 여부", "- 사고원인 코드 확정");
  return L.join("\n");
}

function kv(k, v){ return `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`; }

function toHtml(s){
  const rows = s.rows.length
    ? s.rows.map(r => `<tr><td class="k" style="width:22%">${esc(r.t || "--:--")}</td><td>${esc(r.c)}</td></tr>`).join("")
    : `<tr><td class="k" style="width:22%">--:--</td><td>조치 내용 기재</td></tr>`;
  const who = [
    ["성명", s.pname], ["전화번호", s.ptel],
    ["성별", s.psex], ["연령대", s.page],
    ["부상부위", s.ppart], ["부상종류", s.pkind],
    ["대물파손", s.pdam], ["직업", s.pjob],
    ["장애", "미확인"], ["음주상태", s.drink],
  ].map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");

  return `
  <div class="doc-h">동 향 보 고</div>
  <div class="doc-meta"><span>${esc(s.when.slice(0, 10))}</span><span>보고자: 수성못관리역장(대) ○○○</span></div>
  <div class="doc-title">${esc(titleOf(s))}</div>

  <h3>1. 개요</h3>
  <table>
    ${kv("일시", `${s.when} (${s.wx})`)}
    ${kv("장소", `3호선 > ${s.stn} > ${s.place || "미기재"}`)}
    ${kv("사고유형", s.type)}
    ${kv("사고원인", `${s.c1}${s.c2 ? " > " + s.c2 : ""}`)}
    ${kv("사고자", s.who)}
    ${kv("긴급신고", s.emg)}
    ${kv("출동소속(명)", s.unit)}
    ${kv("출동근거", s.basis)}
    ${kv("최종목적지", s.dest)}
    ${kv("동반인", s.with)}
    ${kv("CCTV 영상 확보", s.cctv ? "[ V ]" : "[ ]")}
    ${kv("승차권반환", `${s.refund}건 ${s.refundw}원`)}
  </table>

  <h3>2. 주요내용</h3>
  <div class="body-p">${esc(s.body)}</div>

  <h3>3. 조치사항</h3>
  <table style="table-layout:fixed">
    <tr><th style="width:22%">시간</th><th>조치내용</th></tr>
    ${rows}
  </table>

  <h3>4. 기타</h3>
  <table>
    ${kv("부상 정도", s.inj)}
    ${who}
    ${kv("민원인 문의사항", s.ask)}
  </table>

  <h3>5. 확인 필요</h3>
  <ul class="chklist">
    <li>개인정보 마스킹(성명·연락처) 확인</li>
    <li>부상정도와 진단명 일치 여부</li>
    <li>사고원인 코드 확정</li>
  </ul>
  <div class="foot">대구교통공사 · 3호선 ${esc(s.stn)}역 · 서식 자동생성(초안)</div>`;
}

let MD = "";
$("gen").onclick = () => {
  const s = collect();
  MD = toMarkdown(s);
  $("out").textContent = MD;
  $("paper").innerHTML = toHtml(s);
  $("paper").style.display = "block";
  $("rawwrap").style.display = "block";
  $("paper").scrollIntoView({ behavior: "smooth", block: "start" });
};

$("copy").onclick = async () => {
  if (!MD) return;
  try { await navigator.clipboard.writeText(MD); $("copy").textContent = "복사됨 ✓"; }
  catch { $("copy").textContent = "복사 실패"; }
  setTimeout(() => ($("copy").textContent = "텍스트 복사"), 1400);
};
$("print").onclick = () => { if (!MD) { $("gen").click(); setTimeout(() => window.print(), 200); } else window.print(); };

const n = new Date();
$("when").value = `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`;
addRow(pad(n.getHours()) + ":" + pad(n.getMinutes()), "사고 발생");
addRow("", "");
</script>
</body>
</html>
