<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매뉴얼·법령 검색 (AI 학습 ②)</title>
<style>
  :root { --bg:#0f1720; --card:#1b2530; --ai:#7c9cf5; --farm:#48bb78; --task:#f0b429; --fg:#e6edf3; --muted:#8b9aa8; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f8; --card:#ffffff; --fg:#1c2733; --muted:#67757f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%; }
  header { padding:14px 16px 6px; max-width:640px; margin:0 auto; }
  h1 { margin:0; font-size:19px; letter-spacing:-.5px; }
  .sub { margin:3px 0 0; color:var(--muted); font-size:12px; }
  .menu { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .menu::-webkit-scrollbar { display:none; }
  .menu a { flex:0 0 auto; font-size:12.5px; font-weight:600; text-decoration:none; color:var(--fg);
    background:var(--card); padding:6px 12px; border-radius:999px; box-shadow:0 1px 2px rgba(0,0,0,.16); }
  .menu a.on { background:var(--ai); color:#0b1420; }
  main { max-width:640px; margin:0 auto; padding:0 12px 40px; }
  .box { background:var(--card); border-radius:14px; padding:11px 13px; margin:0 0 8px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .row { display:flex; gap:7px; }
  input[type=search] { flex:1; min-width:0; font-size:15px; padding:10px 12px; border-radius:11px;
    border:1px solid rgba(139,154,168,.35); background:var(--bg); color:var(--fg); }
  button { font-size:13.5px; font-weight:700; padding:10px 14px; border-radius:11px; border:0;
    background:var(--ai); color:#0b1420; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid rgba(139,154,168,.45); }
  button:active { opacity:.75; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .filters label { font-size:12px; color:var(--muted); background:var(--bg); padding:5px 10px;
    border-radius:999px; border:1px solid rgba(139,154,168,.3); }
  .hint { font-size:12px; color:var(--muted); margin:8px 2px 0; }
  .res { margin:0 0 8px; }
  .card { background:var(--card); border-radius:14px; padding:10px 12px; margin:0 0 8px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .top { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .kind { font-size:11px; font-weight:800; padding:2px 7px; border-radius:7px;
    background:rgba(124,156,245,.16); color:var(--ai); }
  .kind.k1 { background:rgba(72,187,120,.16); color:var(--farm); }
  .kind.k2 { background:rgba(240,180,41,.16); color:var(--task); }
  .ttl { font-size:13px; font-weight:700; flex:1; }
  .art { font-size:11.5px; color:var(--muted); }
  .txt { font-size:13px; color:var(--fg); opacity:.92; white-space:pre-wrap; word-break:break-word; }
  mark { background:rgba(240,180,41,.35); color:inherit; border-radius:3px; padding:0 1px; }
  .acts { display:flex; gap:6px; margin-top:7px; }
  .acts button { font-size:11.5px; padding:6px 10px; }
  footer { max-width:640px; margin:0 auto; padding:0 18px 30px; color:var(--muted); font-size:12px; }
  footer a { color:var(--muted); }
  .status { font-size:12.5px; color:var(--muted); margin:6px 2px; }
</style>
</head>
<body>
<header>
  <h1>🔍 매뉴얼·법령 검색</h1>
  <p class="sub">AI 학습 ② · 키워드(BM25 유사) 검색 · 기기 안에서만 처리</p>
  <nav class="menu">
    <a href="index.html">🏠 홈</a>
    <a href="calendar.html">📅 캘린더</a>
    <a href="train.html">🚝 열차</a>
    <a href="journal.html">🌱 재배일지</a>
    <a href="mental.html">🎾 멘탈</a>
    <a href="ai.html" class="on">🤖 AI학습</a>
    <a href="privacy.html">🔒 개인정보</a>
  </nav>
</header>
<main>
  <div class="box">
    <div class="row">
      <input id="q" type="search" placeholder="예: 에스컬레이터 끼임 조치" autocomplete="off">
      <button id="go">검색</button>
    </div>
    <div class="filters">
      <label><input type="checkbox" class="kf" value="0" checked> 법령</label>
      <label><input type="checkbox" class="kf" value="1" checked> 매뉴얼</label>
      <label><input type="checkbox" class="kf" value="2" checked> 동향보고</label>
    </div>
    <div id="loadbox" class="hint">
      색인 5,102개(약 1.9MB)를 처음 한 번만 내려받습니다(이후 캐시). 데이터 요금 주의.
    </div>
    <div class="row" id="loadrow" style="margin-top:7px">
      <button id="load">색인 불러오기</button>
      <span id="loadmsg" class="status"></span>
    </div>
  </div>
  <div id="status" class="status"></div>
  <div id="results" class="res"></div>
</main>
<footer>
  <p>간이 검색입니다. 조문 인용 전 원문 확인 필수. · <a href="ai.html">AI 학습으로</a></p>
</footer>
<script>
const DATA_URL = "search/data.json";
let D = null, T = null, A = null, ROWS = null;

function el(id){ return document.getElementById(id); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

el("load").addEventListener("click", async () => {
  el("load").disabled = true;
  el("loadmsg").textContent = "내려받는 중…";
  try {
    const t0 = performance.now();
    const r = await fetch(DATA_URL, {cache:"force-cache"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    T = j.titles; A = j.articles; ROWS = j.rows;
    D = j.rows[3];
    el("loadmsg").textContent = `${D.length.toLocaleString()}청크 준비 (${((performance.now()-t0)/1000).toFixed(1)}초)`;
    el("loadrow").style.display = "none";
  } catch (e) {
    el("loadmsg").textContent = "불러오기 실패: " + e.message;
    el("load").disabled = false;
  }
});

function terms(q){
  const words = (q.toLowerCase().match(/[가-힣a-z0-9]{2,}/g) || []);
  const uni = [], bi = [];
  for (const w of words){
    uni.push(w);
    if (w.length >= 2 && /[가-힣]/.test(w)){
      for (let i=0;i<w.length-1;i++) bi.push(w.slice(i,i+2));
    }
  }
  return {uni:[...new Set(uni)], bi:[...new Set(bi)]};
}

function count(hay, needle){
  let c = 0, i = 0;
  while ((i = hay.indexOf(needle, i)) !== -1){ c++; i += needle.length; }
  return c;
}

function search(q){
  const {uni, bi} = terms(q);
  if (!uni.length) return [];
  const want = new Set([...document.querySelectorAll(".kf:checked")].map(x => +x.value));
  const out = [];
  for (let i=0;i<D.length;i++){
    if (!want.has(ROWS[0][i])) continue;
    const text = D[i], low = text.toLowerCase();
    let s = 0, uniHit = 0, biHit = 0, first = -1;
    for (const w of uni){
      const c = count(low, w);
      if (c){ uniHit += c; s += c * (2 + Math.min(w.length, 5)) * (w.length >= 3 ? 1.6 : 1); }
    }
    for (const b of bi){
      const c = count(low, b);
      if (c){ biHit += c; s += c * 0.6; }
    }
    if (!uniHit && biHit < 3) continue;
    if (first < 0){ for (const w of uni){ const k = low.indexOf(w); if (k >= 0){ first = k; break; } } }
    if (first < 0 && bi.length){ const k = low.indexOf(bi[0]); if (k >= 0) first = k; }
    s /= Math.sqrt(text.length / 700);
    out.push({i, s, first: Math.max(0, first)});
  }
  out.sort((a,b) => b.s - a.s);
  return out.slice(0, 12);
}

function snippet(text, at, uni){
  const start = Math.max(0, at - 90);
  let s = text.slice(start, start + 320);
  if (start > 0) s = "…" + s;
  if (start + 320 < text.length) s += "…";
  let h = esc(s);
  for (const w of uni){
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    h = h.replace(re, m => "<mark>" + m + "</mark>");
  }
  return h;
}

function render(list, q){
  const {uni} = terms(q);
  const box = el("results");
  if (!list.length){ box.innerHTML = '<div class="box">검색 결과 없음 — 다른 표현으로 시도해보세요.</div>'; return; }
  box.innerHTML = list.map(r => {
    const i = r.i, kind = ROWS[0][i];
    return `<div class="card">
      <div class="top"><span class="kind k${kind}">${["법령","매뉴얼","동향보고"][kind]}</span>
        <span class="ttl">${esc(T[ROWS[1][i]])}</span></div>
      ${A[ROWS[2][i]] ? `<div class="art">${esc(A[ROWS[2][i]])}</div>` : ""}
      <div class="txt">${snippet(D[i], r.first, uni)}</div>
      <div class="acts"><button data-copy="${i}">본문 복사</button>
        <button class="ghost" data-cite="${i}">출처 복사</button></div>
    </div>`;
  }).join("");
}

el("results").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const i = +(b.dataset.copy ?? b.dataset.cite);
  let text;
  if (b.dataset.copy !== undefined){
    text = D[i];
  } else {
    text = `${T[ROWS[1][i]]}${A[ROWS[2][i]] ? " " + A[ROWS[2][i]] : ""} (${["법령","매뉴얼","동향보고"][ROWS[0][i]]})`;
  }
  try { await navigator.clipboard.writeText(text); b.textContent = "복사됨 ✓"; }
  catch { b.textContent = "복사 실패"; }
  setTimeout(() => { b.textContent = b.dataset.copy !== undefined ? "본문 복사" : "출처 복사"; }, 1400);
});

function run(){
  if (!D){ el("status").textContent = "먼저 색인을 불러와 주세요."; return; }
  const q = el("q").value.trim();
  if (!q) return;
  el("status").textContent = "검색 중…";
  setTimeout(() => {
    const t0 = performance.now();
    const list = search(q);
    render(list, q);
    el("status").textContent = `${list.length}건 · ${Math.round(performance.now()-t0)}ms · 키워드 일치 기준`;
  }, 20);
}

el("go").addEventListener("click", run);
el("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
document.querySelectorAll(".kf").forEach(c => c.addEventListener("change", () => { if (el("q").value.trim()) run(); }));
</script>
</body>
</html>
